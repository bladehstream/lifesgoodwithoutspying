<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life's Good Without Spying</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app" id="app">
    <header class="masthead">
      <h1>Life's Good Without Spying</h1>
      <div class="device"><span class="tag" id="dev-root" data-i18n="tag.checking">checking</span></div>
    </header>

    <section class="hero">
      <div class="signal" aria-hidden="true"><span class="bars"></span><span class="scan"></span></div>

      <p class="verdict" id="verdict" data-i18n="verdict.checking">Checking…</p>
      <p class="explain" id="explain" data-i18n="explain.checking">Reading the TV's state.</p>

      <button id="btn-main" class="primary" autofocus data-i18n="button.enable">Enable protection</button>

      <dl class="readout">
        <div><dt data-i18n="readout.domains">Domain entries</dt><dd id="r-domains">—</dd></div>
        <div><dt data-i18n="readout.hosts">Domain sink</dt><dd id="r-hosts">—</dd></div>
        <div><dt data-i18n="readout.dns">DNS filter</dt><dd id="r-dns">—</dd></div>
        <div><dt data-i18n="readout.ipv6">DNS IPv6 mode</dt><dd id="r-ipv6">—</dd></div>
        <div><dt data-i18n="readout.voice">Voice services</dt><dd id="r-voice">—</dd></div>
        <div><dt data-i18n="readout.ads">Ad services</dt><dd id="r-ads">—</dd></div>
      </dl>
    </section>

    <section class="tools">
      <button id="btn-purge" data-i18n="button.purge">Purge now</button>
      <button id="btn-selftest" data-i18n="button.selftest">Self-test</button>
      <button id="btn-refresh" data-i18n="button.refresh">Refresh</button>
      <button id="btn-log" data-i18n="button.showLog">Show log</button>
      <button id="btn-language">Language: Auto</button>
    </section>

    <section class="stage">
      <section class="layers" id="layers">
        <h2 data-i18n="heading.protections">Protections</h2>
        <div class="layer-grid">
          <button class="layer" data-key="domains.acr" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.domains.acr.title">ACR / Alphonso</b><small data-i18n="layer.domains.acr.detail">Blocks automatic content-recognition uploads</small></span>
          </button>
          <button class="layer" data-key="domains.smartad" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.domains.smartad.title">SmartAd &amp; ad platform</b><small data-i18n="layer.domains.smartad.detail">Blocks ad delivery and tracking</small></span>
          </button>
          <button class="layer" data-key="domains.quickset" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.domains.quickset.title">QuickSet remote codes</b><small data-i18n="layer.domains.quickset.detail">Optional. Blocks remote-code lookup; may affect remote setup</small></span>
          </button>
          <button class="layer" data-key="domains.dashboard" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.domains.dashboard.title">Home dashboard &amp; recs</b><small data-i18n="layer.domains.dashboard.detail">Blocks recommendation telemetry</small></span>
          </button>
          <button class="layer" data-key="domains.lgrecommends" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.domains.lgrecommends.title">LG Content Store</b><small data-i18n="layer.domains.lgrecommends.detail">Optional. Blocks the LG Content Store and its app recommendations; the store will not open</small></span>
          </button>
          <button class="layer" data-key="domains.wiselg" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.domains.wiselg.title">Home app sessions</b><small data-i18n="layer.domains.wiselg.detail">Optional. Blocks app-usage uploads; may break Home previews, sports and channel info</small></span>
          </button>
          <button class="layer" data-key="domains.telemetry" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.domains.telemetry.title">Telemetry &amp; crash uploads</b><small data-i18n="layer.domains.telemetry.detail">Blocks crash and APM phone-home</small></span>
          </button>
          <button class="layer" data-key="domains.sdp" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.domains.sdp.title">LG SDP &amp; clock sync</b><small data-i18n="layer.domains.sdp.detail">Blocks SDP after a 60-second clock-sync grace period; breaks the LG Content Store</small></span>
          </button>
          <button class="layer" data-key="clock.ntp" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.clock.ntp.title">Clock from NTP</b><small data-i18n="layer.clock.ntp.detail">Optional. Sets the time from pool.ntp.org, so SDP is blocked from boot with no grace period</small></span>
          </button>
          <button class="layer" data-key="dns.filter" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.dns.filter.title">Local DNS filter</b><small data-i18n="layer.dns.filter.detail">Routes ConnMan IPv4 DNS through the local helper; IPv6 is a separate companion choice</small></span>
          </button>
          <button class="layer" data-key="dns.disable_ipv6" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.dns.disable_ipv6.title">Disable IPv6 with DNS filter</b><small data-i18n="layer.dns.disable_ipv6.detail">Companion switch; turns ConnMan IPv6 off only while the DNS filter is enabled. If off, IPv6 DNS may bypass the helper.</small></span>
          </button>
          <button class="layer" data-key="voice.stop" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.voice.stop.title">Voice services</b><small data-i18n="layer.voice.stop.detail">Targets listed voice services; does not disable microphone hardware. May break remote voice key</small></span>
          </button>
          <button class="layer" data-key="ads.stop" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.ads.stop.title">Ad services</b><small data-i18n="layer.ads.stop.detail">Stops ad, ACR and telemetry daemons</small></span>
          </button>
          <button class="layer" data-key="lan.block" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.lan.block.title">LAN discovery</b><small data-i18n="layer.lan.block.detail">Block LAN discovery. May break casting</small></span>
          </button>
          <button class="layer" data-key="domains.thinq" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.domains.thinq.title">ThinQ &amp; companion</b><small data-i18n="layer.domains.thinq.detail">Optional. Stops ThinQ/Alexa/IoT daemons and breaks the LG ThinQ app</small></span>
          </button>
          <button class="layer" data-key="purge.boot" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.purge.boot.title">Purge on boot</b><small data-i18n="layer.purge.boot.detail">Clear ACR and voice data at startup</small></span>
          </button>
          <button class="layer" data-key="domains.lgchannels" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.domains.lgchannels.title">LG Channels</b><small data-i18n="layer.domains.lgchannels.detail">Optional. breaks the LG Channels app</small></span>
          </button>
          <button class="layer" data-key="domains.updates" role="switch" aria-checked="false">
            <span class="sw" aria-hidden="true"></span>
            <span class="layer-text"><b data-i18n="layer.domains.updates.title">Firmware updates</b><small data-i18n="layer.domains.updates.detail">Optional. Blocks updates and fixes. <br />Can be handled by the Homebrew Channel</small></span>
          </button>
        </div>
      </section>

      <div class="logview" id="logview" hidden>
        <h2 data-i18n="heading.log">Log</h2>
        <section class="console" id="console" tabindex="0" role="log" aria-label="Log output" data-i18n-label="label.logOutput">
          <pre id="out"></pre>
        </section>
      </div>
    </section>
  </main>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
